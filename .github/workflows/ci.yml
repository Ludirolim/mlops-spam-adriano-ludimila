name: Pipeline CI/CD - Classificador de Spam

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # ETAPA 1: BUILD E LINT (Portão de Qualidade 1: Build limpo + Análise estática)
  # ---------------------------------------------------------------------------
  build:
    name: 1. Build e Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do projeto e Ruff (Lint)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verificar carregamento do modelo e da aplicação (Smoke Build)
        run: python -c "import app.main; print('Build e carregamento do modelo OK!')"

      - name: Portão de Qualidade 1 - Análise estática de código (Lint sem erros críticos)
        run: ruff check --select E9,F app/ tests/ model/

  # ---------------------------------------------------------------------------
  # ETAPA 2: TESTES AUTOMATIZADOS (Portão de Qualidade 2: Pytest)
  # ---------------------------------------------------------------------------
  testes:
    name: 2. Testes Automatizados (Pytest)
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      MODEL_VERSION: v1
      API_KEY: chave-ficticia-123
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências e Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Portão de Qualidade 2 - Executar testes de API (/health e /predict)
        run: python -m pytest -v

  # ---------------------------------------------------------------------------
  # ETAPA 3: EMPACOTAMENTO E PUBLICAÇÃO (Portão de Qualidade 3: Só publica se testes passarem)
  # ---------------------------------------------------------------------------
  empacotamento:
    name: 3. Empacotar e Publicar Imagem Docker (GHCR)
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Construir imagem Docker local (validação do Dockerfile)
        run: docker build -t mlops-spam:v1 .

      - name: Login no GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem versionada no Registry (v1 e SHA do commit)
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_URI=$(echo "ghcr.io/${{ github.repository }}/spam-service" | tr '[:upper:]' '[:lower:]')
          docker tag mlops-spam:v1 "${IMAGE_URI}:v1"
          docker tag mlops-spam:v1 "${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:v1"
          docker push "${IMAGE_URI}:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # ETAPA 4: DEPLOY EM AMBIENTE DE TESTE
  # ---------------------------------------------------------------------------
  deploy:
    name: 4. Deploy em Ambiente de Teste
    needs: empacotamento
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook no ambiente de teste (Render)
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Disparando deploy automático no ambiente de teste..."
            curl -fsSL -X POST "$HOOK"
            echo "Deploy disparado com sucesso!"
          else
            echo "Aviso: Secret DEPLOY_HOOK_URL ainda não configurado no GitHub."
            echo "Imagem publicada no GHCR e pronta para deploy no ambiente de teste!"
          fi
