apiVersion: batch/v1
kind: CronJob
metadata:
  name: verificar-saude
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: checar
              image: curlimages/curl
              args: ["-fsS", "http://spam-api-service:8000/health"]
